syntax = "proto3";

package catalog.v1;

service CatalogService {
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
  rpc ListProducts(ListProductsRequest) returns (stream ListProductsResponse);
  rpc CheckInventory(CheckInventoryRequest) returns (CheckInventoryResponse);
}

message Product {
  string id = 1;
  string name = 2;
  string category = 3;
  int64 price_cents = 4;
  int32 stock_qty = 5;
}

message GetProductRequest {
  string id = 1;
}

message GetProductResponse {
  Product product = 1;
}

message ListProductsRequest {
  string category = 1;
  int32 limit = 2;
}

message ListProductsResponse {
  Product product = 1;
}

message CheckInventoryRequest {
  string product_id = 1;
  int32 qty = 2;
}

message CheckInventoryResponse {
  bool available = 1;
  int32 stock_qty = 2;
}
