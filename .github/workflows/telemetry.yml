name: telemetry

on:
  pull_request:
    paths:
      - "stage-1-monolith/telemetry/**"
      - "stage-1-monolith/internal/telemetry/**_gen.go"
      - ".github/workflows/telemetry.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate the registry
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$WORKSPACE:/work" \
            otel/weaver:v0.22.1 \
            registry check \
              --registry /work/stage-1-monolith/telemetry/registry/

      - name: Generate and verify checked-in code is current
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$WORKSPACE:/work" \
            otel/weaver:v0.22.1 \
            registry generate \
              --registry /work/stage-1-monolith/telemetry/registry/ \
              --templates /work/stage-1-monolith/telemetry/templates/ \
              go \
              /work/stage-1-monolith/internal/telemetry/
          gofmt -w stage-1-monolith/internal/telemetry/
          git diff --exit-code stage-1-monolith/internal/telemetry/

      - name: Diff against base branch
        if: github.event_name == 'pull_request'
        env:
          WORKSPACE: ${{ github.workspace }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF":__base
          git worktree add /tmp/base __base
          if [ ! -f /tmp/base/stage-1-monolith/telemetry/registry/manifest.yaml ]; then
            echo "No baseline registry on $BASE_REF; skipping diff."
            exit 0
          fi
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$WORKSPACE:/work" \
            -v /tmp/base:/baseline \
            otel/weaver:v0.22.1 \
            registry diff \
              --baseline-registry /baseline/stage-1-monolith/telemetry/registry/ \
              --registry /work/stage-1-monolith/telemetry/registry/ \
              --diff-format markdown
